# .github/workflows/droid-issue-fixer.yml
# =============================================================================
# Scheduled + manual GitHub Action that runs `droid exec` headlessly to attempt
# one open issue from this repo. The agent picks the most tractable issue,
# implements a fix on a `droid/ghi<N>-<short-slug>` branch, and commits it. Scripted
# steps then push the branch and open a PR.
#
# Auth/quota/credit failures are quiet (green run + warning annotation) so a
# depleted Factory account does not spam your inbox every week.
# =============================================================================
name: Builder Minion

on:
  workflow_dispatch:
  schedule:
    # Runs Thu-Mon at 09:17 UTC (off-the-hour to avoid GitHub cron spikes).
    # Day-of-week: 0=Sun,1=Mon,4=Thu,5=Fri,6=Sat — cron ranges don't wrap, so
    # Thu-Mon is expressed as the list 0-1,4-6 (not 4-1).
    - cron: "17 9 * * 0-1,4-6"

permissions:
  contents: write
  pull-requests: write
  issues: read
  workflows: write

concurrency:
  group: droid-issue-fixer
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Randomly choose a runner for this workflow run. This spreads droid
  # fixes across the three major platforms so dotfiles changes are
  # validated on more than just Ubuntu. The choice is made once per run
  # and passed to the actual fix job as an output.
  # ------------------------------------------------------------------
  choose-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Pick random runner
        id: pick
        run: |
          runners=("ubuntu-latest" "macos-latest" "windows-latest")
          idx=$((RANDOM % ${#runners[@]}))
          echo "runner=${runners[$idx]}" >> "$GITHUB_OUTPUT"
          echo "Selected runner: ${runners[$idx]}"

  fix-issue:
    needs: choose-runner
    runs-on: ${{ needs.choose-runner.outputs.runner }}
    # A single droid exec run is usually well under 10 min, but give it room.
    timeout-minutes: 45
    # Run all shell steps in bash so the same scripts work on Linux, macOS,
    # and Windows (via Git Bash).
    defaults:
      run:
        shell: bash
    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # ------------------------------------------------------------------
      # 2. Configure git user for commits made inside the runner
      # ------------------------------------------------------------------
      # The droid agent commits changes directly in the workflow. Without an
      # explicit identity, git falls back to the runner image defaults, which
      # produced confusing authors like `Anka <runner@... .local>` on macOS.
      # Set a stable identity before any commits happen.
      # ------------------------------------------------------------------
      - name: Configure git user
        run: |
          git config --global user.name "Droid"
          git config --global user.email "droid@factory.ai"
          echo "Git user: $(git config --global user.name) <$(git config --global user.email)>"

      # ------------------------------------------------------------------
      # 3. Set up a cross-platform temp directory inside the workspace
      # ------------------------------------------------------------------
      - name: Set workflow temp directory
        id: temp
        run: |
          # Keep temp files under the repo workspace so the same relative
          # paths work on Linux, macOS, and Windows (Git Bash). Run this
          # after checkout so actions/checkout does not wipe the directory.
          WORKFLOW_TEMP="$GITHUB_WORKSPACE/.droid-temp"
          mkdir -p "$WORKFLOW_TEMP"
          echo "WORKFLOW_TEMP=$WORKFLOW_TEMP" >> "$GITHUB_ENV"
          echo "Workflow temp: $WORKFLOW_TEMP"

      # ------------------------------------------------------------------
      # 4. Collect open issues + in-flight droid attempts (no installs yet)
      # ------------------------------------------------------------------
      - name: Collect open issues and in-flight droid PRs
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Open issues as compact JSON (number, title, body, labels).
          gh issue list --state open --json number,title,body,labels \
            > $WORKFLOW_TEMP/open-issues.json

          open_count=$(jq 'length' $WORKFLOW_TEMP/open-issues.json)
          echo "Open issues found: $open_count"

          if [ "$open_count" -eq 0 ]; then
            echo "No open issues — nothing to do."
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Existing droid/ghi* branches (in-flight attempts).
          gh api repos/${{ github.repository }}/branches \
            --paginate \
            --jq '[.[] | select(.name | startswith("droid/ghi")) | .name]' \
            > $WORKFLOW_TEMP/droid-branches.json || echo '[]' > $WORKFLOW_TEMP/droid-branches.json

          # Open PRs whose head branch starts with droid/ghi.
          gh pr list --state open --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("droid/ghi")) | .headRefName]' \
            > $WORKFLOW_TEMP/droid-pr-branches.json || echo '[]' > $WORKFLOW_TEMP/droid-pr-branches.json

          # Combine branches + PR head branches into one array, then extract
          # the issue number from each (droid/ghi<N>...) and dedupe.
          # This gives us the set of issue numbers that already have an
          # in-flight droid attempt.
          jq -n \
            --slurpfile branches $WORKFLOW_TEMP/droid-branches.json \
            --slurpfile prs $WORKFLOW_TEMP/droid-pr-branches.json \
            '($branches[0] + $prs[0])
              | map(capture("issue-(?<n>[0-9]+)") | .n | tonumber)
              | unique' > $WORKFLOW_TEMP/inflight-nums.json

          echo "In-flight droid issue numbers: $(cat $WORKFLOW_TEMP/inflight-nums.json)"

          # Filter open issues: keep those whose number is NOT in the
          # in-flight set. Also build the inflight metadata for the prompt.
          jq -n \
            --slurpfile issues $WORKFLOW_TEMP/open-issues.json \
            --slurpfile inflight $WORKFLOW_TEMP/inflight-nums.json \
            --slurpfile branches $WORKFLOW_TEMP/droid-branches.json \
            --slurpfile prs $WORKFLOW_TEMP/droid-pr-branches.json \
            '{
              issues: ($issues[0] | map(select(.number as $n | $inflight[0] | index($n) | not))),
              inflight: {
                issue_numbers: $inflight[0],
                branches: $branches[0],
                pr_branches: $prs[0]
              }
            }' > $WORKFLOW_TEMP/actionable.json

          actionable_count=$(jq '.issues | length' $WORKFLOW_TEMP/actionable.json)
          echo "Actionable issues (excluding in-flight): $actionable_count"

          if [ "$actionable_count" -eq 0 ]; then
            echo "Every open issue already has an in-flight droid attempt — nothing to do."
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_work=true" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 5. Install Droid CLI (only when there is actionable work)
      # ------------------------------------------------------------------
      - name: Install Droid CLI
        if: steps.collect.outputs.has_work == 'true'
        run: |
          curl -fsSL https://app.factory.ai/cli | sh
          # The installer places the binary in ~/.local/bin (or similar);
          # add it to PATH for this and subsequent steps.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Verify it runs.
          "$HOME/.local/bin/droid" --version

      # ------------------------------------------------------------------
      # 6. Install chezmoi (for template validation)
      # ------------------------------------------------------------------
      - name: Install chezmoi
        if: steps.collect.outputs.has_work == 'true'
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          "$HOME/.local/bin/chezmoi" --version

      - name: Write CI chezmoi config
        if: steps.collect.outputs.has_work == 'true'
        run: |
          # Non-interactive config so promptStringOnce/promptBoolOnce never
          # block. Dummy values — only used for execute-template / dry-run
          # validation. Using printf instead of a heredoc to avoid YAML
          # block-scalar indentation conflicts with closing delimiters.
          mkdir -p "$HOME/.config/chezmoi"
          printf '%s\n' \
            '[data]' \
            'email = "droid-ci@example.com"' \
            'work = false' \
            'iterm2 = false' \
            'artifactoryHost = ""' \
            '[data.dev]' \
            'java = false' \
            '[data.fonts]' \
            'sans-serif = "\"Helvetica\",sans-serif"' \
            'serif = "\"Georgia\",serif"' \
            'mono = "\"Fira Code Mono\""' \
            > "$HOME/.config/chezmoi/chezmoi.toml"
          echo "CHEZMOI_CI_CONFIG=$HOME/.config/chezmoi/chezmoi.toml" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # 7. Install shellcheck (for static analysis of shell scripts)
      # ------------------------------------------------------------------
      - name: Install shellcheck
        if: steps.collect.outputs.has_work == 'true'
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck already available"
            shellcheck --version
            exit 0
          fi

          case "$RUNNER_OS" in
            macOS)
              # Silence Homebrew tap-trust warnings on runners that have
              # untrusted taps configured (e.g., aws/tap).
              export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
              brew install shellcheck
              ;;
            Windows)
              choco install shellcheck
              ;;
            Linux)
              # Should already be present on ubuntu-latest, but handle edge case.
              sudo apt-get update && sudo apt-get install -y shellcheck
              ;;
          esac
          shellcheck --version

      # ------------------------------------------------------------------
      # 8. Build the prompt file
      # ------------------------------------------------------------------
      - name: Build prompt
        if: steps.collect.outputs.has_work == 'true'
        run: |
          # Start with the reusable prompt template, then append the live
          # issue/PR data as JSON so the agent can pick from current state.
          cat .github/prompts/fix-issue.md > $WORKFLOW_TEMP/prompt.md
          {
            echo ""
            echo "---"
            echo ""
            echo "## Actionable issues (JSON)"
            echo ""
            echo '```json'
            cat $WORKFLOW_TEMP/actionable.json | jq '.issues'
            echo '```'
            echo ""
            echo "## In-flight droid attempts (JSON)"
            echo ""
            echo '```json'
            cat $WORKFLOW_TEMP/actionable.json | jq '.inflight'
            echo '```'
          } >> $WORKFLOW_TEMP/prompt.md

          echo "Prompt file built ($(wc -l < $WORKFLOW_TEMP/prompt.md) lines)."

      # ------------------------------------------------------------------
      # 9. Run droid exec (capture exit code, do not fail the step)
      # ------------------------------------------------------------------
      - name: Run droid exec
        id: droid
        if: steps.collect.outputs.has_work == 'true'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          set +e
          droid exec \
            --auto medium \
            --model kimi-k2.7-code \
            --output-format json \
            -f $WORKFLOW_TEMP/prompt.md \
            2>&1 | tee $WORKFLOW_TEMP/droid-out.json
          droid_exit=$?
          echo "droid_exit=$droid_exit" >> "$GITHUB_OUTPUT"
          exit 0

      # ------------------------------------------------------------------
      # 10. Classify the droid exec result
      # ------------------------------------------------------------------
      - name: Classify droid result
        id: classify
        if: steps.collect.outputs.has_work == 'true'
        run: |
          set -euo pipefail
          droid_exit="${{ steps.droid.outputs.droid_exit }}"

          # Extract the result text and is_error flag from JSON output.
          result_text=""
          is_error="false"
          if [ -f $WORKFLOW_TEMP/droid-out.json ]; then
            result_text=$(jq -r '.result // ""' $WORKFLOW_TEMP/droid-out.json 2>/dev/null || echo "")
            is_error=$(jq -r '.is_error // false' $WORKFLOW_TEMP/droid-out.json 2>/dev/null || echo "false")
          fi

          # Auth/quota/billing quiet skip: only when droid exec actually
          # failed (non-zero exit or is_error=true). A successful run may
          # mention "FACTORY_API_KEY" or "credit" in its output without
          # being an auth failure.
          if [ "$droid_exit" -ne 0 ] || [ "$is_error" = "true" ]; then
            quiet_signatures='Authentication failed|invalid.*key|insufficient|quota|limit exceeded|402|403|429|billing|plan limit|rate limit'
            if echo "$result_text" | grep -iqE "$quiet_signatures"; then
              echo "::warning::Droid exec hit an auth/quota/billing limit — skipping quietly."
              echo "Raw droid result (for diagnostics):"
              echo "$result_text"
              {
                echo "## Builder Minion — quiet skip"
                echo ""
                echo "Droid exec returned a quota/auth/billing error and was skipped quietly."
                echo ""
                echo "**Result:** $result_text"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "quiet_skip=true" >> "$GITHUB_OUTPUT"
              echo "hard_fail=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "quiet_skip=false" >> "$GITHUB_OUTPUT"

          if [ "$droid_exit" -ne 0 ]; then
            echo "hard_fail=true" >> "$GITHUB_OUTPUT"
            echo "::error::Droid exec failed (exit $droid_exit) with an unexpected error."
            {
              echo "## Builder Minion — failed"
              echo ""
              echo "Droid exec exited with code **$droid_exit**."
              echo ""
              # Show just the result text, not the full JSON blob.
              if [ -f $WORKFLOW_TEMP/droid-out.json ]; then
                jq -r '.result // "(no result text)"' $WORKFLOW_TEMP/droid-out.json 2>/dev/null \
                  || cat $WORKFLOW_TEMP/droid-out.json
              else
                echo "(no output captured)"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0  # Step succeeds so the finish step can salvage; job fails below.
          fi

          echo "hard_fail=false" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # 11. Extract session metadata for the job summary + PR body
      # ------------------------------------------------------------------
      - name: Extract session metadata
        id: metadata
        if: steps.collect.outputs.has_work == 'true'
        run: |
          set -euo pipefail

          session_id="unknown"
          duration_ms=0
          num_turns=0

          if [ -f $WORKFLOW_TEMP/droid-out.json ]; then
            session_id=$(jq -r '.session_id // "unknown"' $WORKFLOW_TEMP/droid-out.json 2>/dev/null || echo "unknown")
            duration_ms=$(jq -r '.duration_ms // 0' $WORKFLOW_TEMP/droid-out.json 2>/dev/null || echo 0)
            num_turns=$(jq -r '.num_turns // 0' $WORKFLOW_TEMP/droid-out.json 2>/dev/null || echo 0)
          fi

          echo "session_id=$session_id" >> "$GITHUB_OUTPUT"
          echo "duration_ms=$duration_ms" >> "$GITHUB_OUTPUT"
          echo "num_turns=$num_turns" >> "$GITHUB_OUTPUT"

          # Dump all JSON fields (minus the verbose result text) to the job
          # summary so model, usage, and other metadata are visible at a
          # glance. Whatever the CLI includes will show up here.
          {
            echo ""
            echo "### Droid session details"
            echo ""
            if [ -f $WORKFLOW_TEMP/droid-out.json ]; then
              jq -r 'del(.result) | to_entries[] | "- **\(.key):** \(.value | tostring)"' \
                $WORKFLOW_TEMP/droid-out.json 2>/dev/null || echo "- (failed to parse session metadata)"
            else
              echo "- (no output captured)"
            fi
            echo ""
            echo "_Full JSON output is available in the run artifacts._"
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # 12. Fetch full session chat from the Factory API
      # ------------------------------------------------------------------
      - name: Fetch session messages
        if: steps.collect.outputs.has_work == 'true'
        continue-on-error: true
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          set -euo pipefail

          session_id="${{ steps.metadata.outputs.session_id }}"
          if [ "$session_id" = "unknown" ] || [ -z "$session_id" ]; then
            echo "No session ID — skipping message fetch."
            echo '{"messages":[]}' > $WORKFLOW_TEMP/droid-messages.json
            exit 0
          fi

          echo "Fetching messages for session $session_id..."

          # Paginate through the session messages API and write each page to
          # its own file. Using files instead of command-line arguments
          # avoids "Argument list too long" errors when sessions have many
          # messages.
          pages_dir="$WORKFLOW_TEMP/messages-pages"
          mkdir -p "$pages_dir"
          rm -f "$pages_dir"/*.json

          cursor=""
          page_num=0
          while true; do
            url="https://api.factory.ai/api/v0/sessions/$session_id/messages?limit=100"
            if [ -n "$cursor" ]; then
              url="${url}&cursor=${cursor}"
            fi

            page_file="$pages_dir/page-$(printf '%03d' $page_num).json"
            curl -fsSL \
              -H "Authorization: Bearer $FACTORY_API_KEY" \
              "$url" > "$page_file"

            cursor=$(jq -r '.cursor // ""' "$page_file" 2>/dev/null || echo "")
            if [ -z "$cursor" ]; then
              break
            fi
            page_num=$((page_num + 1))
          done

          # Combine all pages into a single messages array.
          if ls "$pages_dir"/page-*.json >/dev/null 2>&1; then
            jq -s '{messages: [.[].messages[]?]}' "$pages_dir"/page-*.json \
              > $WORKFLOW_TEMP/droid-messages.json
          else
            echo '{"messages":[]}' > $WORKFLOW_TEMP/droid-messages.json
          fi

          msg_count=$(jq '.messages | length' $WORKFLOW_TEMP/droid-messages.json)
          echo "Fetched $msg_count messages."

      # ------------------------------------------------------------------
      # 13. Upload droid session artifacts
      # ------------------------------------------------------------------
      - name: Upload droid session artifacts
        if: steps.collect.outputs.has_work == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: droid-session-${{ github.run_id }}
          path: |
            .droid-temp/droid-out.json
            .droid-temp/prompt.md
            .droid-temp/droid-messages.json
          if-no-files-found: warn
          retention-days: 30

      # ------------------------------------------------------------------
      # 14. Finish: push branch + open PR (or salvage on error)
      # ------------------------------------------------------------------
      - name: Push branch and open PR
        if: steps.collect.outputs.has_work == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          hard_fail="${{ steps.classify.outputs.hard_fail }}"
          quiet_skip="${{ steps.classify.outputs.quiet_skip }}"

          if [ "$quiet_skip" = "true" ]; then
            echo "Quiet skip — not pushing or opening a PR."
            exit 0
          fi

          # Look for a droid/ghi* branch the agent created.
          droid_branch=$(git branch --list 'droid/ghi*' | head -1 | sed 's/^[* ]*//')

          if [ -z "$droid_branch" ]; then
            # Fallback: if the agent made uncommitted changes on the default
            # branch, commit them onto a new droid/issue branch.
            if git diff --quiet && git diff --cached --quiet; then
              echo "Agent declined — no branch and no changes."
              {
                echo "## Builder Minion — declined"
                echo ""
                echo "Droid exec completed successfully but made no changes (declined all issues)."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # Try to infer the issue number from the prompt data.
            issue_num=$(jq -r '.issues[0].number' $WORKFLOW_TEMP/actionable.json)
            droid_branch="droid/ghi${issue_num}-salvage"
            git checkout -b "$droid_branch"
            git add -A
            git commit -m "fix: droid attempt for issue #${issue_num}" || true
          fi

          # Push the branch.
          git push origin "$droid_branch"

          # Extract the issue number from the branch name for PR linking.
          issue_num=$(echo "$droid_branch" | sed -n 's|.*droid/ghi\([0-9]*\).*|\1|p')

          # Build the PR body from the droid-fix PR template, substituting
          # HTML-comment placeholders with live values. Using a template
          # file keeps the PR structure versioned and editable without
          # touching the workflow YAML.
          pr_body="$WORKFLOW_TEMP/pr-body.md"
          cp .github/PULL_REQUEST_TEMPLATE/droid-fix.md "$pr_body"

          # Extract just the human-readable result text from the JSON,
          # not the full blob (which includes usage stats, session IDs,
          # and thousands of chars of noise). Write to a temp file so sed
          # can insert it via the `r` command (safe for multi-line text
          # with special characters — no string interpolation needed).
          if [ -f $WORKFLOW_TEMP/droid-out.json ]; then
            jq -r '.result // "(no result text)"' $WORKFLOW_TEMP/droid-out.json 2>/dev/null \
              > $WORKFLOW_TEMP/droid-summary.txt || echo '(failed to parse droid output)' > $WORKFLOW_TEMP/droid-summary.txt
          else
            echo '(no output captured)' > $WORKFLOW_TEMP/droid-summary.txt
          fi

          # Substitute the droid summary (multi-line → sed `r` + `d`).
          # Use -i.bak and remove the backup so the same syntax works on
          # both GNU sed (Linux/Windows Git Bash) and BSD sed (macOS).
          sed -i.bak -e "/<!-- DROID_SUMMARY -->/r $WORKFLOW_TEMP/droid-summary.txt" \
            -e "/<!-- DROID_SUMMARY -->/d" "$pr_body"
          rm -f "$pr_body.bak"

          # Substitute the issue number (simple scalar).
          sed -i.bak "s|<!-- ISSUE_NUM -->|${issue_num:-?}|" "$pr_body"
          rm -f "$pr_body.bak"

          # Insert the hard-fail warning or remove the placeholder.
          if [ "$hard_fail" = "true" ]; then
            printf '> ⚠️ Droid exec errored during this run. This **draft** PR contains whatever work was salvaged — review carefully.\n' \
              > $WORKFLOW_TEMP/droid-warning.txt
            sed -i.bak -e "/<!-- DROID_WARNING -->/r $WORKFLOW_TEMP/droid-warning.txt" \
              -e "/<!-- DROID_WARNING -->/d" "$pr_body"
            rm -f "$pr_body.bak"
          else
            sed -i.bak '/<!-- DROID_WARNING -->/d' "$pr_body"
            rm -f "$pr_body.bak"
          fi

          # Ensure the `droid` label exists.
          gh label create droid --description "PR generated by droid-issue-fixer action" \
            --color 6B41EF --force 2>/dev/null || true

          # Use the droid's commit subject as the PR title. The prompt
          # instructs the agent to write a Conventional Commit subject
          # (imperative mood, ≤50 chars), which makes a far better title
          # than the generic fallback. For the salvage path (where the
          # workflow itself committed with a generic message) or any edge
          # case, fall back to the old generic title.
          pr_title=$(git log --format='%s' -1 "$droid_branch" 2>/dev/null || true)
          if [ -z "$pr_title" ] || [ "$pr_title" = "fix: droid attempt for issue #${issue_num}" ]; then
            pr_title="fix: droid attempt for issue #${issue_num:-?}"
          fi

          # Open the PR (draft if the run errored).
          pr_flags=(--title "$pr_title" --body-file "$pr_body" --label droid)
          if [ "$hard_fail" = "true" ]; then
            pr_flags+=(--draft)
          fi

          gh pr create --head "$droid_branch" --base main "${pr_flags[@]}"

          {
            echo "## Builder Minion — PR opened"
            echo ""
            echo "Branch: \`$droid_branch\`"
            if [ "$hard_fail" = "true" ]; then
              echo "Status: **draft** (run errored, salvaged)"
            else
              echo "Status: ready for review"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # 15. Fail the job if droid exec had an unexpected hard failure
      # ------------------------------------------------------------------
      - name: Fail on hard error
        if: steps.classify.outputs.hard_fail == 'true'
        run: |
          echo "Droid exec had an unexpected hard failure — failing the job."
          exit 1
