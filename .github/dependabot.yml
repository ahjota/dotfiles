# .github/dependabot.yml
# =============================================================================
# Dependabot configuration for the ahjota/dotfiles chezmoi repo.
#
# Only the `github-actions` ecosystem is enabled here. GitHub Actions version
# pins (actions/checkout, actions/upload-artifact, etc.) are the one drift
# surface that Dependabot handles deterministically and for free — no need to
# spend Factory credits on them via the Meter Reader Minion.
#
# All other pinned versions (Factory model pins, antidote plugin repos, and
# any future Brewfile entries) are outside Dependabot's supported ecosystems
# and are handled by the droid-drift-monitor workflow.
# =============================================================================
version: 2

updates:
  # Keep GitHub Actions versions current across all workflow files.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Weekly on Tuesdays, matching the Meter Reader Minion's cadence.
      interval: "weekly"
      day: "tuesday"
    # Open PRs with a clear, conventional-commit-style title.
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group all Actions updates into a single PR to reduce noise.
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
